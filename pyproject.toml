[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "buem"
dynamic = ["version"]
description = "Building energy model for analysis of hourly thermal load(ISO 52019-1:2017, 5R1C)"
authors = [
    { name="Somadutta Sahoo", email="s.sahoo@uu.nl" }
]
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.14"
keywords = [
    "building",
    "energy-model",
    "energy-communities",
    "parameterization",
    "open-source",
    "heating-cooling",
    "python",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "cvxpy",
    "dask[array]",  # required at runtime by weather's xr.open_mfdataset point-query path; not declared by weather[pointquery] itself
    "flask",
    "flask-swagger-ui",
    "joblib",
    "jsonschema",
    "marshmallow>=4.0.0",
    "marshmallow-dataclass>=8.0.0",
    "matplotlib",
    "numba",
    "numpy",
    "openpyxl",
    "pandas",
    "psutil",
    "psycopg2",
    "pulp",
    "pvlib",
    "pyarrow",
    "python-dotenv",
    "requests",  # weather_cache.py's optional remote (WEATHER_API_URL) fetch backend
    "scipy",
    # weather: https://github.com/UU-BUEM/weather -- compulsory (2026-08-03): all
    # solar/T/GHI/DHI/DNI attributes come from this package's real per-location
    # fetch, no bundled/local-file fallback. Not on PyPI/conda yet, so a direct
    # git reference (PEP 508), pinned rather than tracking a branch so a
    # given buem commit always resolves the same weather: see infrastructure/
    # env/buem_env.yml's header comment for the reasoning, and keep the two
    # references in step.
    #
    # A commit rather than a tag: upstream's main is 19 commits past v1.9.2
    # and no published tag names what is in use, so pinning to the latest
    # release would roll those commits back. Installs 1.9.3.dev19+g36ff059a7.
    "weather[pointquery,solar] @ git+https://github.com/UU-BUEM/weather.git@36ff059a780e1bce85e4dd170a6386f357696895",
    # occupancy: https://github.com/UU-BUEM/occupancy -- compulsory (2026-08-07):
    # all Q_ig/elecLoad/occ_nothome/occ_sleeping attributes come from this
    # package's real HouseholdProfile/ServiceBuildingProfile generation, no
    # synthetic fallback. Not on PyPI/conda yet, so a direct git reference
    # (PEP 508), pinned to a released tag rather than a branch so a given
    # buem commit always resolves the same occupancy: see infrastructure/
    # env/buem_env.yml's header comment for the reasoning, and keep the two
    # references in step.
    #
    # Tracks upstream directly; the enerplanet/occupancy fork pin is retired.
    # v6.0.0 is an annotated tag, object b105a5a6847a85d8bcc82d3bd671f0ecfd3bc97e,
    # pointing at commit f4e1adc7b3adb3f92adeacec5facb17ee8db5d89. Both are
    # recorded because pip reports the tag object while git checks out the
    # commit; either value changing means the tag was moved.
    "occupancy @ git+https://github.com/UU-BUEM/occupancy.git@v6.0.0",
]

[project.optional-dependencies]
server = [
    "gunicorn",
]
docs = [
    "sphinx>=9.0.0",
    "sphinx-rtd-theme>=3.0.0",
]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
buem = "buem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
buem = [
    "apis/openapi.yaml",
    "data/**/*",
    "softwares/**/*",
    "integration/json_schema/**/*",
]

[tool.setuptools_scm]
version_file = "src/buem/_version.py"
fallback_version = "1.2.0"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-ignore = [
    "E203", "E501",
    "RUF100",  # some `# noqa: E402` comments target flake8 (this repo's IDE linter),
               # not ruff -- ruff doesn't select E402 itself, so it would otherwise
               # flag those as "unused noqa" and fail on a rule flake8 still enforces.
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: takes seconds rather than milliseconds -- a real weather fetch, a full model solve, or a timing comparison that needs a cold/warm cache pair. Deselect with `-m 'not slow'`.",
]
# A numpy RuntimeWarning inside a solve ("invalid value encountered in ...")
# means a NaN or +/-inf reached an aggregation -- physically meaningless output
# that still produces a number, so it must fail loudly rather than scroll past
# in the warnings summary. The suite is clean under this today; if a third-party
# warning ever needs exempting, add a narrow `default::RuntimeWarning:<module>`
# entry rather than dropping the rule.
filterwarnings = ["error::RuntimeWarning"]
