# ──────────────────────────────────────────────────────────────────────────────
# BuEM API — Docker Compose
# ──────────────────────────────────────────────────────────────────────────────
# ── Build & run ────────────────────────────────────────────────────────────
#   docker compose -f infrastructure/container/docker-compose.yml up -d
#
# ── Logs / status / shell ───────────────────────────────────────────────────
#   docker compose -f infrastructure/container/docker-compose.yml logs -f
#   docker compose -f infrastructure/container/docker-compose.yml ps
#   docker compose -f infrastructure/container/docker-compose.yml exec api bash
# ──────────────────────────────────────────────────────────────────────────────
name: buem

services:
  api:
    image: ghcr.io/enerplanet/buem-model:${BUEM_MODEL_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infrastructure/container/Dockerfile
    env_file: ../../.env
    environment:
      - PYTHONPATH=/app/src
      - BUEM_WEATHER_DIR=/app/data/weather
      - BUEM_CBC_EXE=/opt/conda/envs/buem_env/bin/cbc
      - BUEM_RESULTS_DIR=/app/results
    ports:
      - "5000:5000"
    volumes:
      - ../../src/buem/data/weather:/app/data/weather:ro
      - ../../src/buem/logs:/app/logs:rw
      - ../../src/buem/results:/app/results:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
