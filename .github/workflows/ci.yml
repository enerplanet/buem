name: CI

"on":
  push:
    branches: ["main", "develop", "enerplanet"]
  pull_request:
    branches: ["main", "enerplanet"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # cfg_attribute.py fetches real weather at module-import time, so nearly
      # every test needs a processed archive on disk -- CI has no access to
      # the real (1-2GB/provider/year) archives, so this points at a small,
      # real (spatially cropped, not synthetic) MERRA-2 2018 fixture fetched
      # from the weather repo below, covering buem's own test locations.
      # See https://github.com/UU-BUEM/weather/tree/main/fixtures/ci.
      WEATHER_DATA_DIR: /tmp/weather-ci-fixture/fixtures/ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          channels: conda-forge,defaults
          activate-environment: buem_env
          environment-file: infrastructure/env/buem_env.yml
          python-version: "3.14"

      - name: Install package
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Fetch weather CI fixture
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/UU-BUEM/weather.git /tmp/weather-ci-fixture
          git -C /tmp/weather-ci-fixture sparse-checkout set fixtures/ci

      - name: Contract drift check
        run: |
          set -e
          SCHEMA_DIR=src/buem/integration/json_schema
          eval "$(sed -n 's/^\([a-z_]*\)=\(.*\)$/CONTRACT_\1="\2"/p' "$SCHEMA_DIR/contract.txt")"
          base="https://raw.githubusercontent.com/${CONTRACT_repo}/${CONTRACT_tag}/${CONTRACT_path}"
          for f in request_schema.json response_schema.json; do
            curl -fsSL "$base/$f" -o "/tmp/upstream_$f"
            # pinned copies carry an extra leading "$comment" field (their own
            # provenance note) that upstream's file doesn't -- ignored below.
            python3 -c "import json,sys; u=json.load(open(sys.argv[1])); p=json.load(open(sys.argv[2])); p.pop('\$comment',None); sys.exit(0 if u==p else 1)" \
              "/tmp/upstream_$f" "$SCHEMA_DIR/$f" \
              || { echo "::error::$f has drifted from ${CONTRACT_repo}@${CONTRACT_tag}/${CONTRACT_path}/$f -- re-sync (see $SCHEMA_DIR/README.md)"; exit 1; }
          done

      - name: Lint
        shell: bash -l {0}
        run: ruff check src/ tests/

      - name: Type check
        shell: bash -l {0}
        run: mypy src

      - name: Test with coverage
        shell: bash -l {0}
        run: pytest -q --cov=buem --cov-report=xml

      - name: Smoke test CLI
        shell: bash -l {0}
        run: buem validate

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
