name: Publish Docker image

# Builds the BuEM API image from this repo's own checkout (no cross-repo
# `git clone`) and pushes it to GHCR. The `enerplanet` integration branch is
# the release train: a push there moves `:latest`, so the packaged deployment
# (buem-gateway/environment/docker-compose.prod.yml, image
# ghcr.io/enerplanet/buem-model) picks up fixes on the next `docker compose
# pull`. Semver tags (v*.*.*) additionally publish {{version}} and
# {{major}}.{{minor}} for pinned deployments.

"on":
  push:
    branches: ["enerplanet"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push buem-model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enerplanet/buem-model
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/enerplanet' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/container/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUEM_VERSION=${{ steps.meta.outputs.version }}
            BUEM_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=buem-model
          cache-to: type=gha,mode=max,scope=buem-model
